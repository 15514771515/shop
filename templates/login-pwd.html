{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号密码登录 - 简易商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-5">
                <h3 class="text-center mb-4">简易商城 - 账号密码登录</h3>
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input id="username" type="text" class="form-control" placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input id="password" type="password" class="form-control" placeholder="请输入密码">
                    </div>
                    <div id="msg" style="color:red"></div>
                    <button onclick="log()" class="btn btn-primary w-100">登录</button>
                <div class="text-center mt-3">
                    <a href="/login_email/">邮箱验证码登录</a>
                </div>
                <div class="text-center mt-4">
                    还没有账号？<a href="/register/">立即注册</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    function log(){
        let username=document.getElementById("username").value
        let password=document.getElementById("password").value
        api.post('/log_pwd/',{username:username,password:password}).then(
            function(res){
                localStorage.setItem("access_token",res.data.access_token)
                localStorage.setItem("refresh_token",res.data.refresh_token)
                console.log(res.data)
                localStorage.setItem("uid",res.data.uid)
                if(localStorage.getItem("if_new")=="1"){
                    location.href="/file/"
                    localStorage.remove("if_new")

                    return
                }
                location.href="/"
            }
        ).catch(
            function(err){
                let msg=document.getElementById("msg")
                msg.innerText="登陆失败,账号或密码错误"
            }
        )
    }
</script>
</body>
</html>
