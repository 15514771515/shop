{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 手机适配核心 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            padding: 40px 15px;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.06);
        }
        .form-control {
            height: 48px;
            font-size: 16px;
        }
        .btn {
            height: 48px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <!-- 手机下占满大部分宽度，电脑限制宽度 -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="mb-3">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">← 返回</a>
            </div>
            <div class="card p-4 p-md-5">
                <h3 class="text-center mb-4">修改密码</h3>
                    <div class="mb-3">
                        <label class="form-label">旧密码</label>
                        <input id="password" type="password" name="old_password" placeholder="请输入旧密码" class="form-control">
                        <span style="color:red" id="msg1"></span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input placeholder="请输入新密码" id="password1" type="password" name="new_password" class="form-control">
                        <span style="color:red" id="msg2"></span>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">确认新密码</label>
                        <input placeholder="请确认新密码" id="password2" type="password" name="confirm_password" class="form-control">
                        <span style="color:red" id="msg3"></span>
                    </div>
                    <button onclick="sub()" class="btn btn-primary w-100">确认修改</button>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(!localStorage.getItem("refresh_token")){location.href="/"}
    function sub(){
        let password=document.getElementById("password")
        let password1=document.getElementById("password1")
        let password2=document.getElementById("password2")
        let msg1=document.getElementById("msg1")
        let msg2=document.getElementById("msg2")
        let msg3=document.getElementById("msg3")
        let pa=true
        if(password.value==''){
            pa=false
            msg1.innerText="请输入原密码"
            password.style.border="2px solid red"
        }
        if(password1.value==''){
            pa=false
            msg2.innerText="请输入新密码"
            password1.style.border="2px solid red"
        }
        if((password1.value.length>12 || password1.value.length<6) && password1.value!=""){
            pa=false
            msg2.innerText="密码长度不能小于6且不能大于12"
            password1.style.border="2px solid red"
        }
        if(password1.value!=password2.value){
            pa=false
            msg3.innerText="两次输入密码不一致"
            password2.style.border="2px solid red"
        }
        if(password.value==password1.value){
            pa=false
            msg1.innerText="新密码不能与旧密码一致"
            password1.style.border="2px solid red"
            password.style.border="2px solid red"
        }
        setTimeout(()=>{
            msg1.innerText=""
            msg2.innerText=""
            msg3.innerText=""
            password.style.border="1px solid #DEE2E6"
            password1.style.border="1px solid #DEE2E6"
            password2.style.border="1px solid #DEE2E6"
        },7000)
        if(pa){
            api.patch("/modify/",{old_pwd:password.value,new_pwd:password1.value}).then(
                function(res){
                    alert("密码修改成功")
                }
            ).catch(
                function(err){
                    alert("原密码错误")
                }
            )
        }
    }
</script>
</body>
</html>
