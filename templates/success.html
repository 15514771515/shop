{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card text-center p-4">
                    <div class="text-success fs-1 mb-3">✓</div>
                    <h3 class="card-title mb-3">支付成功</h3>
                    <p class="text-muted">订单已确认，感谢您的购买！</p>
                    <div class="text-start bg-light p-3 rounded my-4">
                        <p class="mb-1"><strong>订单编号：</strong><span id="code">2026091210245689</span></p>
                        <p class="mb-1"><strong>支付金额：</strong>¥<span id="p">199</span>.00</p>
                        <p class="mb-0"><strong>支付方式：</strong>微信</p>
                    </div>
                    <a href="/" class="btn btn-primary w-100">返回首页</a>
                </div>
            </div>
        </div>
    </div>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
    <script>
        let code=localStorage.getItem("cod")
        api.get("/order_de/",{params:{code:code}}).then(
            function(res){
                let p=document.getElementById("p")
                p.innerText=res.data.sum-100
                let cod=document.getElementById("code")
                cod.innerText=code
            }
        )

    </script>
</body>
</html>
