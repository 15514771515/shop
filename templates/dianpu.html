<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    const pathArr = location.pathname.split('/')
    const pk = pathArr.pop()
    console.log(pk)
    if(localStorage.getItem("refresh_token")){
        api.get("/get_file/").then(
            function(res){
                let ava=document.getElementById("avatar")
                ava.src=baseURL+res.data.avatar_url
                let den=document.getElementById("den")
                den.innerText="个人主页"
                den.href="/user/"
            }
        )
    }
    api.get("/get_dianpu/",{params:{name:pk}}).then(
        function(res){
            console.log(res.data[0])
            let name=document.getElementById("name")
            name.innerText=res.data[1].name
            let jianjie=document.getElementById("jianjie")
            jianjie.innerText=res.data[1].jianjie
            let d=res.data[0]
            if(!localStorage.getItem("c")){
                localStorage.setItem("c","全部分类")
            }
            let cc=document.getElementById("cc")
            cc.value=localStorage.getItem("c")
            let pk=document.getElementById("pk")
            let bb=0
            for(i=0;i<d.length;i++){
                let da=d[i]
                if(da.categlory==localStorage.getItem("c") || localStorage.getItem("c")=="全部分类"){
                    bb+=1
                    pk.innerHTML+=`
                        <div class="col-md-3 col-sm-6">
                            <div class="card h-100">
                                <img src="${baseURL}${da.img_url}" class="card-img-top" alt="${da.name}">
                                <div class="card-body">
                                    <h5 class="card-title">${da.name}</h5>
                                    <p class="text-danger fs-5">¥${da.price}</p>
                                    <p class="text-muted small mb-3">库存：${da.storage}件</p>
                                    <a href="/detail/${da.id}" class="btn btn-outline-primary w-100">查看详情</a>
                                </div>
                            </div>
                        </div>
                    `
                }
            }
            console.log(bb)
            if(bb==0){
                pk.innerHTML+=`
                    <div class="text-center text-secondary py-5">
                        <p class="fs-5">暂时没有商品</p>
                    </div>
                `
            }
        }
    )
    function jj(btn){
        localStorage.setItem("c",btn.value)
        location.reload()
    }
</script>
