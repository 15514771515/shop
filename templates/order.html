<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="{% static 'api.js' %}"></script>
<script>
    if(!localStorage.getItem("refresh_token")){
        location.href="/"
    }
    api.get("/get_file/").then(
        function(res){
            let ava=document.getElementById("avatar")
            ava.src=baseURL+res.data.avatar_url
        }
    )
    function po(pl){
        api.get("/get_order/",{params:{state:pl}}).then(
            function(res){
                let da=res.data
                da.reverse()
                let con=document.getElementById("con")
                let li=[]
                if(da.length==0){
                    con.innerHTML+=`
                        <div class="text-center text-secondary py-5">
                            <p class="fs-5">暂时没有商品</p>
                        </div>
                    `
                }
                for(n=0;n<da.length;n++){
                    let d=da[n]
                    let su=Number(d.count)*Number(d.price)
                    if(li.includes(d.code)){
                        console.log(d.code)
                        let iii=document.getElementById(d.code)
                        let hh=document.getElementById("hh"+d.code)
                        iii.innerHTML+=`
                            <a href="/detail/${d.id}"><img src="${baseURL}${d.img_url}" class="goods-img"></a>
                            <div>
                                <div>${d.name}</div>
                                <div class="text-muted">¥${d.price} × ${d.count}</div>
                            </div>
                        `
                        let nn=Number(hh.innerText.slice(1))
                        nn+=d.price*d.count
                        hh.innerText="¥"+nn
                    }else{
                        con.innerHTML+=`
                            <div name="${d.state}" class="order-item p-4 shadow-sm">
                                <div class="d-flex flex-md-row flex-column justify-content-between align-items-start mb-3 gap-2">
                                    <span>订单编号：${d.code}</span>
                                    <span class="text-danger">${d.state}</span>
                                </div>
                                <hr>
                                <div id="${d.code}" class="d-flex align-items-center gap-3 mb-3">
                                    <a href="/detail/${d.id}"><img src="${baseURL}${d.img_url}" class="goods-img"></a>
                                    <div>
                                        <div>${d.name}</div>
                                        <div class="text-muted">¥${d.price} × ${d.count}</div>
                                    </div>

                                </div>
                                <div class="d-flex flex-md-row flex-column justify-content-between align-items-start gap-3">
                                    <span>共计金额：<strong id="hh${d.code}" class="fs-5">¥${su-100}</strong></span>
                                    <a href="/order_de/${d.code}" class="btn btn-outline-primary">查看详情</a>
                                </div>
                            </div>
                        `
                        li.push(d.code)
                    }
                }
            }
        )
    }
    if(!localStorage.getItem("lh")){localStorage.setItem("lh","b1全部订单")}
    let bid=localStorage.getItem("lh").slice(0,2)
    let but=document.getElementById(bid)
    but.className="btn btn-primary"
    let lo=["b1","b2","b3","b4","b5"]
    for(i=0;i<lo.length;i++){
        let di=lo[i]
        if(di!=bid){
            let bt=document.getElementById(di)
            bt.className="btn btn-outline-primary"
        }
    }
    po(localStorage.getItem("lh").slice(2))
    function lt(btn){
        let lo=["b1","b2","b3","b4","b5"]
        let state=["未付款","待发货","待收获","已完成"]
        for(i=0;i<lo.length;i++){
            let di=lo[i]
            if(di!=btn.id){
                let bt=document.getElementById(di)
                bt.className="btn btn-outline-primary"
            }
        }
        btn.className="btn btn-primary"
        localStorage.setItem("lh",btn.id+btn.innerText)
        location.reload()
    }
</script>
