<script>
    const pathArr = location.pathname.split('/')
    const pk = Number(pathArr.pop())
    console.log(pk)
    if(localStorage.getItem("refresh_token")){
        let den=document.getElementById("den")

                den.href="/user/"
                ava.src=baseURL+res.data.avatar_url
            }
        )
    }
    function openPreview(imgSrc) {
      const mask = document.createElement('div');
      mask.style = `
        position:fixed;
        top:0;left:0;
        width:100vw;height:100vh;
        background:rgba(0,0,0,0.85);
        display:flex;
        align-items:center;
        justify-content:center;
        z-index:9999;
        cursor:pointer;
      `;
      const bigImg = document.createElement('img');
      bigImg.src = imgSrc;
      bigImg.style = "max-width:90%;max-height:90vh;";

      mask.appendChild(bigImg);
      document.body.appendChild(mask);
      mask.onclick = () => mask.remove();
    }
    function del(btn){
        if(!confirm('你确定要删除这条评论吗?')){
            return
        }
        let co_id=btn.id.slice(2)
        api.delete("/comments/",{params:{id:co_id}})
        let ddd=document.getElementById("di"+co_id)
        ddd.remove()
    }
    function getRandName(){
        const t = Date.now() + Math.random().toString(36).slice(2,10)
        return t + ".jpg"
    }
    async function compressImg(file) {
        return new Promise((resolve) => {
            const reader = new FileReader()
            reader.readAsDataURL(file)
            reader.onload = e => {
                const imgObj = new Image()
                imgObj.src = e.target.result
                imgObj.onload = () => {
                    const max = 1200
                    let w = imgObj.width, h = imgObj.height
                    if(w>max||h>max){
                        if(w>h){ h = h*max/w; w=max }
                        else{ w = w*max/h; h=max }
                    }
                    const canvas = document.createElement('canvas')
                    canvas.width = w
                    canvas.height = h
                    canvas.getContext('2d').drawImage(imgObj,0,0,w,h)
                    canvas.toBlob(b=>resolve(b), 'image/jpeg', 0.7)
                }
            }
        })
    }
    let comment=document.getElementById("comments")
    api.get("/comments/",{params:{id:pk,uid:localStorage.getItem("uid")}}).then(
        function(res){
            let da=res.data
            console.log(da)
            da.reverse()
            for(i=0;i<da.length;i++){
                let d=da[i]
                comment.innerHTML+=`
                    <div id="di${d.id}" class="border rounded p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div class="d-flex align-items-center gap-2">
                                <img onclick="openPreview('${baseURL}${d.avatar_url}')" src="${baseURL}${d.avatar_url}" class="rounded-circle" width="36" height="36" alt="头像">
                                <span class="text-secondary">${d.name}</span>
                                <span class="badge bg-success">${d.me}</span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="text-secondary small">${d.time}</span>
                                <span id='b${i}'></span>
                            </div>
                        </div>
                        <p class="mt-2 mb-0">${d.text}</p>
                        <div id="img${i}" class="mt-3 d-flex gap-2 flex-wrap">
                        </div>
                    </div>
                `
            }
            for(k=0;k<da.length;k++){
                let dat=da[k]
                let img_div=document.getElementById("img"+k)
                let b=document.getElementById("b"+k)
                if(dat.me=='我'){
                    b.innerHTML=`<button id="bu${dat.id}" onclick="del(this)" class="btn btn-sm btn-outline-danger">删除</button>`
                }
                for(l=1;l<=6;l++){
                    let img_url=dat['img'+l]
                    if(img_url!="#" && img_url!=''){
                        console.log(img_url)
                        img_div.innerHTML+=`
                            <img onclick="openPreview('${baseURL}${img_url}')" src="${baseURL}${img_url}" class="rounded" style="width:100px;height:100px;" alt="评论图片">
                        `
                    }
                }
            }
        }
    )

    let f=document.getElementById("file")
    let n=0
    if(localStorage.getItem("refresh_token")){
        api.get("/clear/").then(
            function(res){
                return
            }
        )
    }
    f.onchange=async function(e){
        if(!localStorage.getItem("refresh_token")){
            alert("请先登录")
            return
        }
        if(n>=6){
            alert("图片已达上限")
            return
        }
        let fd=new FormData()
        const img=await compressImg(e.target.files[0])
        console.log(img)
        fd.append("img",img,getRandName())
        api.post("/upload/",fd).then(
            function(res){
                let di=document.getElementById("img_div")
                n++
                di.innerHTML+=`<img onclick="openPreview('${baseURL}${res.data.url}')" id="imgg${n}" src="${baseURL}${res.data.url}" width="100" height="100">`
                if(n>0){
                    let che=document.getElementById("che")
                    che.innerHTML=`<button id="ch" onclick="che()" class="btn btn-warning">撤销</button>`
                }
            }
        )
    }
    function che(){
        let di=document.getElementById("imgg"+n)
        di.remove()
        n--
        if(n<=0){
            let che=document.getElementById("ch")
            che.remove()
        }
    }
    function send(){
        let te=document.getElementById("te")
        if(te.value==''){
            te.style.border="2px solid red"
            let msg=document.getElementById("msg")
            msg.innerText="评论不能为空"
            setTimeout(()=>{
                msg.innerText=''
                te.style.border="1px solid #DEE2E6"
            },7000)
            return
        }
        let t=te.value
        let da={}
        da['text']=t
        da['id']=pk
        let li=[]
        for(h=1;h<=6;h++){
            let im=document.getElementById("imgg"+h)
            console.log(im)
            if(im!=null){
                let io="/media"+"/ar"+im.src.slice(baseURL.length+14)
                li.push(im.src.slice(baseURL.length))
                da['img'+h]=io
            }else{
                da['img'+h]='#'
            }
        }
        console.log(li)
        api.post("/move/",{list:li})
        console.log(da)
        api.post("/realese/",da).then(
            function(res){
                n=0
                let com=document.getElementById("comments")
                let d=res.data
                const htmlStr = `
                    <div id="di${d.id}" class="border rounded p-3 mb-3">
                        <div class="d-flex justify-content-between">
                            <div class="d-flex align-items-center gap-2">
                                <img onclick="openPreview('${baseURL}${d.avatar_url}')" src="${baseURL}${d.avatar_url}" class="rounded-circle" width="36" height="36" alt="头像">
                                <span class="text-secondary">${d.name}</span>
                                <span class="badge bg-success">我</span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="text-secondary small">${d.time}</span>
                                <span><button id="bu${d.id}" onclick="del(this)" class="btn btn-sm btn-outline-danger">删除</button></span>
                            </div>
                        </div>
                        <p class="mt-2 mb-0">${d.text}</p>
                        <div id="iimm" class="mt-3 d-flex gap-2 flex-wrap">
                        </div>
                    </div>
                `
                const div = document.createRange().createContextualFragment(htmlStr)
                let mmmm=document.getElementById("mmmm")
                mmmm.innerText="发送成功"
                let comme=document.getElementById("comments")
                comme.prepend(div)
                let iimm=document.getElementById("iimm")
                for(ii=1;ii<=6;ii++){
                    console.log(da)
                    let img_u=da['img'+ii]
                    if(img_u!='' && img_u!="#" && img_u!=undefined){
                        iimm.innerHTML+=`<img onclick="openPreview('${baseURL}/${img_u}')" src="${baseURL}/${img_u}" width="100" height="100">`
                    }
                }
            }
        )
        let img_div=document.getElementById("img_div")
        img_div.innerHTML=''
        let che=document.getElementById("che")
        che.innerHTML=''
        te.value=""

        setTimeout(()=>{
            mmmm.innerText=''
        },7000)
        i=0
    }
    api.get("/get_det/"+pk).then(
        function(res){
            let d=res.data
            let img=document.getElementById("img")
            let mingzi=document.getElementById("mingzi")
            let jiage=document.getElementById("jiage")
            let leibie=document.getElementById("leibie")
            let kucun=document.getElementById("kucun")
            let jianjie=document.getElementById("jianjie")
            let xinghao=document.getElementById("xinghao")
            let jiekou=document.getElementById("jiekou")
            let dpi=document.getElementById("dpi")
            let dengguang=document.getElementById("dengguang")
            let shiyong=document.getElementById("shiyong")
            let dianpu=document.getElementById("dianpu")
            dianpu.innerText=d.dianpu
            img.src=baseURL+d.img_url
            img.onclick=function(){openPreview(baseURL+d.img_url)}
            mingzi.innerText=d.name
            localStorage.setItem("name",d.name)
            jiage.innerText="¥"+d.price
            leibie.innerText=d.categlory
            kucun.innerText=d.storage
            jianjie.innerText=d.introduce
            xinghao.innerText=d.xinghao
            jiekou.innerText=d.jiekou
            dpi.innerText=d.dpi
            dengguang.innerText=d.light
            shiyong.innerText=d.use
        }
    )

    let kkk=document.getElementById("666")
    let kk=document.getElementById("777")
    let aa=document.getElementById("add")
    let bb=document.getElementById("buy")
    if(!localStorage.getItem("refresh_token")){
            kkk.href="#"

            bb.onclick=function(){

            }
        }
    function add(btn){

                btn.disabled=false
                alert(`${res.data.num}个  [ ${localStorage.getItem("name")} ]  已经加入你的购物车!`)

        setTimeout(()=>{btn.disabled=false},100)

    function hh(){
        api.post("/tijiao/",{id_list:[pk],count_list:["1"]}).then(

                    alert(`[ ${err.response.data.name} ] 库存不足`)
